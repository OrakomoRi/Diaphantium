name: Channel Builds

on:
  push:
    branches-ignore:
      - main
      - builds
    paths-ignore:
      - "site/**"
      - "images/**"
      - "index.html"
      - "**/*.md"
  delete:

permissions:
  contents: write

concurrency:
  group: builds-branch
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Build
        run: npm run build

      - name: Test
        run: |
          npm test
          npm run test:e2e

      - name: Publish channel
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CHANNEL=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')
          VERSION=$(jq -r .version package.json)
          BUILDS="$RUNNER_TEMP/builds"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags --depth=50 origin +refs/heads/builds:refs/remotes/origin/builds
          git worktree add --detach "$BUILDS" origin/builds

          mkdir -p "$BUILDS/channels/$CHANNEL"
          cp dist/loader.min.js dist/diaphantium.min.js "$BUILDS/channels/$CHANNEL/"
          jq -n \
            --arg branch "$BRANCH" \
            --arg commit "$GITHUB_SHA" \
            --arg version "$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{branch: $branch, commit: $commit, version: $version, date: $date}' > "$BUILDS/channels/$CHANNEL/build.json"

          cd "$BUILDS"
          git add --force "channels/$CHANNEL"
          git commit -m "channel $CHANNEL: ${GITHUB_SHA::7}"

          for attempt in 1 2 3; do
            if git push origin HEAD:builds; then
              exit 0
            fi
            git fetch --no-tags --depth=50 origin +refs/heads/builds:refs/remotes/origin/builds
            git rebase origin/builds
          done
          exit 1

  remove:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Remove channel
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          CHANNEL=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')
          BUILDS="$RUNNER_TEMP/builds"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags --depth=50 origin +refs/heads/builds:refs/remotes/origin/builds
          git worktree add --detach "$BUILDS" origin/builds
          cd "$BUILDS"

          if [ -z "$CHANNEL" ] || [ ! -d "channels/$CHANNEL" ]; then
            echo "No channel to remove for $BRANCH"
            exit 0
          fi

          git rm -r --quiet "channels/$CHANNEL"
          git commit -m "remove channel $CHANNEL"

          for attempt in 1 2 3; do
            if git push origin HEAD:builds; then
              exit 0
            fi
            git fetch --no-tags --depth=50 origin +refs/heads/builds:refs/remotes/origin/builds
            git rebase origin/builds
          done
          exit 1
